# ############################################################################
# Model: E2E ASR with Transformer
# Features: Discrete Audio Tokens
# Encoder: Transformer Encoder
# Decoder: Transformer Decoder + (CTC/ATT joint) beamsearch
# Tokens: unigram
# losses: CTC + KLdiv (Label Smoothing loss)
# Authors: Peter Plantinga
# ############################################################################
# Seed needs to be set at top of yaml, before objects with parameters are made
seed: 3420
__set_seed: !apply:speechbrain.utils.seed_everything [!ref <seed>]
output_folder: !ref results/conformer_en/<seed>
output_wer_folder: !ref <output_folder>/
save_folder: !ref <output_folder>/save
train_log: !ref <output_folder>/train_log.txt
tokenizer_fr_folder: manifests/fr_tokenizer
tokenizer_en_folder: manifests/en_tokenizer
tokenizer_de_folder: manifests/de_tokenizer
quantizer_path: !PLACEHOLDER

# Data files
#pretrained_path: !PLACEHOLDER
data_folder: data
train_fr_manifest: manifests/train_fr.json
valid_fr_manifest: manifests/valid_fr.json
test_fr_manifest: manifests/test_fr.json
train_en_manifest: manifests/train_en.json
valid_en_manifest: manifests/valid_en.json
test_en_manifest: manifests/test_en.json
train_de_manifest: manifests/train_de.json
valid_de_manifest: manifests/valid_de.json
test_de_manifest: manifests/test_de.json
fr_combined: manifests/words_fr.txt
en_combined: manifests/words_en.txt
de_combined: manifests/words_de.txt
train_languages: ["en"]
test_portion: 0.02

#ckpt_interval_minutes: 15 # save checkpoint every N min

####################### Training Parameters ####################################
number_of_epochs: 20
optimizer_step_limit: 250000
batch_size: 32 # This works with a 32GB GPU ! (bs * nb_gpu * accum) > 128 !
ctc_weight: 0.3
grad_accumulation_factor: 6
loss_reduction: 'batchmean'
sorting: random
num_workers: 4
#precision: fp16 # bf16, fp16 or fp32

# stages related parameters
lr_adam: 0.001
weight_decay: 0.01
warmup_steps: 12000
augment_warmup: 8000

# BPE parameters
token_type: unigram  # ["unigram", "bpe", "char"]
character_coverage: 1.0

# Feature parameters
sample_rate: 16000
n_fft: 400
n_mels: 80
n_mfcc: 20

# This setup works well for A100 80GB GPU, adapts it to your needs.
# Or turn it off (but training speed will decrease)
dynamic_batching: True
max_batch_length_train: 300
max_batch_length_val: 200 # we reduce it as the beam is much wider (VRAM)
num_bucket: 200
shuffle: True # if true re-creates batches at each epoch shuffling examples.
batch_ordering: random
max_batch_ex: 256

dynamic_batch_sampler_train:
    max_batch_length: !ref <max_batch_length_train>
    num_buckets: !ref <num_bucket>
    shuffle: !ref <shuffle>
    batch_ordering: !ref <batch_ordering>
    max_batch_ex: !ref <max_batch_ex>

dynamic_batch_sampler_valid:
    max_batch_length: !ref <max_batch_length_val>
    num_buckets: !ref <num_bucket>
    shuffle: !ref <shuffle>
    batch_ordering: !ref <batch_ordering>
    max_batch_ex: !ref <max_batch_ex>

# Dataloader options
train_dataloader_opts:
    batch_size: !ref <batch_size>
    #shuffle: True
    num_workers: !ref <num_workers>

valid_dataloader_opts:
    batch_size: 1

test_dataloader_opts:
    batch_size: 1


####################### Model Parameters ###########################
# Transformer
d_model: 512
nhead: 8
num_encoder_layers: 12
num_decoder_layers: 6
d_ffn: 2048
transformer_dropout: 0.1
activation: !name:torch.nn.GELU
output_neurons: 5120
embedding_size: 80

# Outputs
blank_index: 0
label_smoothing: 0.1
pad_index: 0
bos_index: 1
eos_index: 2

# Decoding parameters
min_decode_ratio: 0.0
max_decode_ratio: 1.0
valid_search_interval: !ref <number_of_epochs>
valid_beam_size: 1 # We do greedy here so it's faster to decode ...
test_beam_size: 10
ctc_weight_decode: 0.3
scorer_beam_scale: 0.3

# Quantizer parameters
# Since we're loading and not training, number of clusters is all we need
n_clusters: 1000

############################## models ################################

quantizer: !new:speechbrain.integrations.audio_tokenizers.kmeans.MiniBatchKMeansSklearn
    n_clusters: !ref <n_clusters>


embedding: !new:speechbrain.nnet.embedding.Embedding
    num_embeddings: !ref <n_clusters>
    embedding_dim: !ref <embedding_size>

#CNN: !new:speechbrain.lobes.models.convolution.ConvolutionFrontEnd
#    input_shape: [8, 10, !ref <embedding_size>]
#    num_blocks: 2
#    num_layers_per_block: 1
#    out_channels: (64, 512) 
#    kernel_sizes: [!tuple "(80,3)", !tuple "(1,5)"]
#    padding: valid
#    strides: (2, 2)
#    residuals: (False, False)
CNN: !new:speechbrain.nnet.CNN.Conv2d
    input_shape: [8, 10, !ref <embedding_size>]
    out_channels: 512
    kernel_size: (80, 4)
    stride: (1, 4)
    padding: valid

Transformer: !new:speechbrain.lobes.models.transformer.TransformerASR.TransformerASR # yamllint disable-line rule:line-length
    input_size: 512
    tgt_vocab: !ref <output_neurons>
    d_model: !ref <d_model>
    nhead: !ref <nhead>
    num_encoder_layers: !ref <num_encoder_layers>
    num_decoder_layers: !ref <num_decoder_layers>
    d_ffn: !ref <d_ffn>
    dropout: !ref <transformer_dropout>
    conformer_activation: !ref <activation>
    activation: !ref <activation>
    encoder_module: conformer
    attention_type: RelPosMHAXL
    normalize_before: True
    causal: False

ctc_lin: !new:speechbrain.nnet.linear.Linear
    input_size: !ref <d_model>
    n_neurons: !ref <output_neurons>

seq_lin: !new:speechbrain.nnet.linear.Linear
    input_size: !ref <d_model>
    n_neurons: !ref <output_neurons>

modules:
    embedding: !ref <embedding>
    CNN: !ref <CNN>
    Transformer: !ref <Transformer>
    seq_lin: !ref <seq_lin>
    ctc_lin: !ref <ctc_lin>

model: !new:torch.nn.ModuleList
    - [!ref <embedding>, !ref <CNN>, !ref <Transformer>, !ref <seq_lin>, !ref <ctc_lin>]

# We define two optimizers as we have two stages (training + finetuning)
Adam: !name:torch.optim.AdamW
    lr: !ref <lr_adam>
    weight_decay: !ref <weight_decay>

# Scorer
ctc_scorer: !new:speechbrain.decoders.scorer.CTCScorer
    eos_index: !ref <eos_index>
    blank_index: !ref <blank_index>
    ctc_fc: !ref <ctc_lin>

scorer: !new:speechbrain.decoders.scorer.ScorerBuilder
    full_scorers: [!ref <ctc_scorer>]
    weights:
        ctc: !ref <ctc_weight_decode>
    scorer_beam_scale: !ref <scorer_beam_scale>

valid_search: !new:speechbrain.decoders.S2STransformerBeamSearcher
    modules: [!ref <Transformer>, !ref <seq_lin>]
    bos_index: !ref <bos_index>
    eos_index: !ref <eos_index>
    min_decode_ratio: !ref <min_decode_ratio>
    max_decode_ratio: !ref <max_decode_ratio>
    beam_size: !ref <valid_beam_size>
    using_eos_threshold: False
    length_normalization: True
    scorer: !ref <scorer>

test_search: !new:speechbrain.decoders.S2STransformerBeamSearcher
    modules: [!ref <Transformer>, !ref <seq_lin>]
    bos_index: !ref <bos_index>
    eos_index: !ref <eos_index>
    min_decode_ratio: !ref <min_decode_ratio>
    max_decode_ratio: !ref <max_decode_ratio>
    beam_size: !ref <test_beam_size>
    temperature: 1.15
    using_eos_threshold: True
    scorer: !ref <scorer>

log_softmax: !new:torch.nn.LogSoftmax
    dim: -1

ctc_cost: !name:speechbrain.nnet.losses.ctc_loss
    blank_index: !ref <blank_index>
    reduction: !ref <loss_reduction>

seq_cost: !name:speechbrain.nnet.losses.kldiv_loss
    label_smoothing: !ref <label_smoothing>
    reduction: !ref <loss_reduction>

#noam_annealing: !new:speechbrain.nnet.schedulers.NoamScheduler
#    lr_initial: !ref <lr_adam>
#    n_warmup_steps: !ref <warmup_steps>
scheduler: !name:transformers.get_wsd_schedule
    num_warmup_steps: !ref <warmup_steps>
    warmup_type: linear
    num_decay_steps: 0           # NO decay
    num_training_steps: 10000000 # Some suitably huge number


checkpointer: !new:speechbrain.utils.checkpoints.Checkpointer
    checkpoints_dir: !ref <save_folder>
    recoverables:
        model: !ref <model>
        #noam_scheduler: !ref <noam_annealing>
        counter: !ref <epoch_counter>

epoch_counter: !new:speechbrain.utils.epoch_loop.EpochCounter
    limit: !ref <number_of_epochs>

############################## Augmentations ###################################

normalize: !new:speechbrain.processing.features.InputNormalization
    norm_type: sentence

compute_features: !new:speechbrain.lobes.features.MFCC
    deltas: True
    context: False
    sample_rate: !ref <sample_rate>
    n_fft: !ref <n_fft>
    n_mels: !ref <n_mels>
    n_mfcc: !ref <n_mfcc>

train_logger: !new:speechbrain.utils.train_logger.FileTrainLogger
    save_file: !ref <train_log>

error_rate_computer: !name:speechbrain.utils.metric_stats.ErrorRateStats
acc_computer: !name:speechbrain.utils.Accuracy.AccuracyStats
cer_computer: !name:speechbrain.utils.metric_stats.ErrorRateStats
    split_tokens: True


# Loader for pretrained quantizer
pretrainer: !new:speechbrain.utils.parameter_transfer.Pretrainer
  loadables:
    quantizer: !ref <quantizer>
  paths:
    quantizer: !ref <quantizer_path>/quantizer.ckpt
