#####################
# Speechbrain recipe for Bilingual Networks -- Measuring Attrition
#
# Developed by:
#  * Peter Plantinga (2025)
# Based on (non-speechbrain) recipe by:
#  * Peter Donhauser (2024)
# Based on recipe by:
#  * Loren Lugosch (2023?)
# etc.
seed: 12345
__set_seed: !apply:torch.manual_seed [!ref <seed>]

#######################
# Data and storage hyperparameters
data_folder: !PLACEHOLDER
output_folder: !ref results/<seed>
save_folder: !ref <output_folder>/save
train_log: !ref <output_folder>/train_log.txt
train_fr_manifest: manifests/train_fr.json
valid_fr_manifest: manifests/valid_fr.json
test_fr_manifest: manifests/test_fr.json
supported_languages: ["fr", "en"]
train_languages: ["fr"]
wrd_files:
  fr: data/words_fr.csv
  en: data/words_en.csv
phn_files:
  fr: data/phonemes_fr.csv
  en: data/phonemes_en.csv
test_portion: 0.05

train_logger: !new:speechbrain.utils.train_logger.FileTrainLogger
    save_file: !ref <train_log>

checkpointer: !new:speechbrain.utils.checkpoints.Checkpointer
  checkpoints_dir: !ref <save_folder>
  recoverables:
      model: !ref <model>
      counter: !ref <epoch_counter>

###############
# Feature hyperparameters
# Corresponds to one frame every 10 ms
# Window size == FFT bins == 32 ms
fs: 16000
downsample_factor: 160
n_mels: 128
n_fft: 512
#time_shift: 0
#n_output_quantize: 0

compute_features: !new:speechbrain.lobes.features.Fbank
  sample_rate: !ref <fs>
  n_mels: !ref <n_mels>
  n_fft: !ref <n_fft>
  win_length: !ref <n_fft> * 1000 // <fs>
  hop_length: !ref <downsample_factor> * 1000 // <fs>

#################
# Training hyperparameters
lr: 0.001
patience: 5
lr_factor: .1
batch_size: 64
num_epochs: 30
length_mean: 2.25
length_var: 1
max_grad_norm: 1.0
skip_nonfinite_grads: True
precision: bf16
phoneout: 1
wordout: 1
langin: 0
langin_test: 0
p_noise: 0.0

dataloader_options:
  batch_size: !ref <batch_size>
  num_workers: 8

epoch_counter: !new:speechbrain.utils.epoch_loop.EpochCounter
  limit: !ref <num_epochs>

opt_class: !name:torch.optim.Adam
  lr: !ref <lr>

lr_annealing: !name:torch.optim.lr_scheduler.ReduceLROnPlateau
    factor: !ref <lr_factor>
    patience: !ref <patience>
    mode: max  # Measuring accuracy -- higher is better

#################
# Model hyperparameters
model: !new:models.ASRSpecNet
  config: !new:types.SimpleNamespace
    fs: !ref <fs>
    num_phonemes: 84
    num_homologes: 56
    n_mel: !ref <n_mels>
    n_mfcc_out: 128
    cnn_out_size: 128
    rnn_hidden_size: 256
    num_rnn_layers: 1
    rnn_bidirectional: False
    rnn_drop: 0.3
    downsample_factor: !ref <downsample_factor>
    vocabulary_size: 8000 # 4000 each, plus "Silence"
