#####################
# Speechbrain recipe for Bilingual Networks -- Measuring Attrition
#
# Developed by:
#  * Peter Plantinga (2025)
# Based on (non-speechbrain) recipe by:
#  * Peter Donhauser (2024)
# Based on recipe by:
#  * Loren Lugosch (2023?)
# etc.
seed: 12345
__set_seed: !apply:torch.manual_seed [!ref <seed>]

#######################
# Data and storage hyperparameters
data_folder: data
output_folder: !ref results/bilingual_<seed>
save_folder: !ref <output_folder>/save
train_log: !ref <output_folder>/train_log.txt
confusions_valid: !ref <output_folder>/confusions_valid.txt
confusions_test: !ref <output_folder>/confusions_test.txt
metric_log: !ref <output_folder>/metric_log.json
pretrained_path: !PLACEHOLDER
train_fr_manifest: manifests/train_fr.json
valid_fr_manifest: manifests/valid_fr.json
test_fr_manifest: manifests/test_fr.json
train_en_manifest: manifests/train_en.json
valid_en_manifest: manifests/valid_en.json
test_en_manifest: manifests/test_en.json
supported_languages: ["fr", "en"]
train_languages: ["fr", "en"]
word_files:
  fr: data/words_fr.csv
  en: data/words_en.csv
phon_files:
  fr: data/phonemes_fr.csv
  en: data/phonemes_en.csv
test_portion: 0.02
fr_weight: 1.0
en_weight: 0.0

train_logger: !new:speechbrain.utils.train_logger.FileTrainLogger
    save_file: !ref <train_log>

# Save after every 10 epochs, they don't take so much space with this small of model
checkpoint_after_epochs: 10
checkpointer: !new:speechbrain.utils.checkpoints.Checkpointer
  checkpoints_dir: !ref <save_folder>
  recoverables:
      model: !ref <model>
      counter: !ref <epoch_counter>
      #lr_annealing: !ref <lr_annealing>

###############
# Feature hyperparameters
# Corresponds to one frame every 10 ms
# Window size == FFT bins == 32 ms
fs: 16000
downsample_factor: 160
n_mels: 128
n_fft: 512

# win_length and hop_length are in ms, convert from frames
compute_features: !new:speechbrain.lobes.features.Fbank
  sample_rate: !ref <fs>
  n_mels: !ref <n_mels>
  n_fft: !ref <n_fft>
  win_length: !ref <n_fft> * 1000 // <fs>
  hop_length: !ref <downsample_factor> * 1000 // <fs>

#################
# Training hyperparameters
# Number of batches in data is ~8000, 64*8000 ~= 500k samples
# 64k samples / 64 == 1000 batches per epoch, 8 epochs to see all data once
# Convergence happens roughly after 20 times seeing all data once
# Run for 150 epochs which is close-ish to 8 * 20
lr: 0.001
batch_size: 64
num_epochs: 250
max_grad_norm: 5.0
random_crop_len: 3.5  # seconds
skip_nonfinite_grads: True
phone_feedback: False

# For some weird reason this seems to cause memory leaks
#precision: bf16

# Check validation every 1000 batches so we can track
# which models are learning the fastest (mono or bilingual)
dataloader_options:
  batch_size: !ref <batch_size>
  num_workers: 4
  shuffle: True
  looped_nominal_epoch: 500

test_loader_options:
  batch_size: !ref <batch_size>
  num_workers: 4
  shuffle: False

epoch_counter: !new:speechbrain.utils.epoch_loop.EpochCounter
  limit: !ref <num_epochs>

opt_class: !name:torch.optim.Adam
  lr: !ref <lr>
  weight_decay: 0.0001

#lr_annealing: !new:speechbrain.nnet.schedulers.WarmAndExpDecayLRSchedule
#  lr: !ref <lr>
#  n_warmup_steps: 8000
#  total_steps: 80000
#  decay_factor: 0.3

#################
# Model hyperparameters
phone_outputs: 49
word_outputs: 8000
model: !new:word_phone_model.WordPhoneModel
  input_size: !ref <n_mels>
  phone_outputs: !ref <phone_outputs>
  word_outputs: !ref <word_outputs>
  cnn_channels: 128
  rnn_neurons: 256
  rnn_layers: 1
  rnn_bidirectional: False
  rnn_dropout: 0.2
  phone_bottleneck: False

phon_fr_metric: !new:torchmetrics.classification.MulticlassAccuracy
  num_classes: !ref <phone_outputs>
  average: micro
  ignore_index: 0
phon_en_metric: !copy <phon_fr_metric>
phon_metrics:
  fr: !ref <phon_fr_metric>
  en: !ref <phon_en_metric>

word_fr_metric: !new:torchmetrics.classification.MulticlassAccuracy
  num_classes: !ref <word_outputs>
  average: micro
  ignore_index: 0
word_en_metric: !copy <word_fr_metric>
word_metrics:
  fr: !ref <word_fr_metric>
  en: !ref <word_en_metric>

phon_fr_confusion: !new:torchmetrics.classification.MulticlassConfusionMatrix
  num_classes: !ref <phone_outputs>
  ignore_index: 0
phon_en_confusion: !copy <phon_fr_confusion>
phon_confusions:
  fr: !ref <phon_fr_confusion>
  en: !ref <phon_en_confusion>

# Add metrics to modules cuz they complain if they're not on the model device
modules:
  model: !ref <model>
  phon_fr_metric: !ref <phon_fr_metric>
  phon_en_metric: !ref <phon_en_metric>
  word_fr_metric: !ref <word_fr_metric>
  word_en_metric: !ref <word_en_metric>
  phon_fr_confusion: !ref <phon_fr_confusion>
  phon_en_confusion: !ref <phon_en_confusion>

pretrainer: !new:speechbrain.utils.parameter_transfer.Pretrainer
  loadables:
    model: !ref <model>
  paths:
    model: !ref <pretrained_path>/model.ckpt
